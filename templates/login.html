<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — ConsultantOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F7F6F3;--surface:#fff;--bd:#E7E3DD;--ink:#24231F;--ink2:#6B675E;--ink3:#9A948A;--accent:#2E4C6B}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
    font-family:'Noto Sans TC','Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:20px}
  .wrap{width:100%;max-width:360px}
  .brand{text-align:center;margin-bottom:26px}
  .mk{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;background:var(--accent);margin-bottom:14px}
  .mk span{width:18px;height:18px;border:2.5px solid #fff;border-radius:5px;display:block}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .brand p{font-size:13px;color:var(--ink3);margin-top:4px}
  .card{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .err{margin-bottom:18px;padding:10px 12px;border-radius:8px;background:#F5E8E5;border:1px solid #E6CcC6;color:#9E4A40;font-size:13px}
  label{display:block;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .fg{margin-bottom:16px}
  input{width:100%;height:40px;border:1px solid var(--bd);border-radius:8px;background:#fff;padding:0 12px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,76,107,.1)}
  button{width:100%;height:42px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .12s;margin-top:4px}
  button:hover{background:#26405C}
  .hint{text-align:center;font-size:12px;color:var(--ink3);margin-top:20px}
  .hint code{background:#EFEDE7;padding:1px 6px;border-radius:4px;font-family:'Inter',monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="mk"><span></span></span>
    <h1>ConsultantOS</h1>
    <p>顧問營運平台 · 請登入</p>
  </div>
  <div class="card">
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <div class="fg">
        <label for="u">帳號</label>
        <input id="u" type="text" name="username" required autofocus placeholder="輸入帳號">
      </div>
      <div class="fg">
        <label for="p">密碼</label>
        <input id="p" type="password" name="password" required placeholder="輸入密碼">
      </div>
      <button type="submit">登入</button>
    </form>
  </div>
  <p class="hint">預設帳號 <code>admin</code>　密碼 <code>admin1234</code></p>
</div>
</body>
</html>
